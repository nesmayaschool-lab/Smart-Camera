<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F766E"><title>محرر الفيديو — الكاميرا الذكية</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f6f4ef;color:#1b1b1b;font-family:system-ui,"Noto Sans Arabic",sans-serif}h1{font-size:23px;margin:8px 0 14px}.panel{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 3px 14px #0001}.preview{background:#111;border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:220px}canvas{width:100%;max-height:65vh;object-fit:contain;display:block}video{width:100%;max-height:34vh;background:#111;border-radius:10px}label{display:block;margin:12px 0;font-weight:650}input[type=range]{width:100%;accent-color:#0f766e}button,a.btn{display:flex;justify-content:center;align-items:center;width:100%;min-height:50px;padding:10px;margin:8px 0;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:17px;font-weight:700;text-decoration:none}button.secondary{background:#334155}button:disabled{opacity:.45}small,.hint{color:#555;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:14px;color:#0f766e;min-height:22px}
</style></head><body>
<h1>محرر الفيديو بعد التسجيل</h1>
<div class="panel"><div class="preview"><canvas id="out"></canvas></div><p class="hint">حرّك منزلقات المنظور والدوران والحجم، ثم صدّر نسخة جديدة دون تغيير الفيديو الأصلي المحفوظ.</p></div>
<div class="panel">
 <video id="source" controls playsinline></video>
 <label>الحجم <output id="zoomVal">100%</output><input id="zoom" type="range" min="50" max="180" value="100"></label>
 <label>دوران Z <output id="rotVal">0°</output><input id="rot" type="range" min="-180" max="180" value="0"></label>
 <label>منظور X <output id="xVal">0°</output><input id="tiltX" type="range" min="-65" max="65" value="0"></label>
 <label>منظور Y <output id="yVal">0°</output><input id="tiltY" type="range" min="-65" max="65" value="0"></label>
 <div class="grid"><button id="flipX" class="secondary">قلب أفقي</button><button id="flipY" class="secondary">قلب رأسي</button></div>
 <button id="reset" class="secondary">إعادة الضبط</button>
 <button id="export">تصدير الفيديو المعدّل</button>
 <div id="status" class="status" role="status"></div>
 <a class="btn" href="./index.html">العودة إلى الكاميرا الذكية</a>
</div>
<script>
(()=>{
 const $=id=>document.getElementById(id),v=$('source'),c=$('out'),ctx=c.getContext('2d');
 let blob=null,url=null,flipX=false,flipY=false,raf=0,recorder=null,chunks=[];
 const params=new URLSearchParams(location.search),videoId=params.get('id');
 const dbOpen=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('autocam',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
 async function load(){try{if(!videoId)throw Error('لم يتم تحديد فيديو. افتح المحرر من قائمة فيديوهاتي.');const db=await dbOpen();const item=await new Promise((resolve,reject)=>{const q=db.transaction('v').objectStore('v').get(videoId);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(!item?.blob)throw Error('لم أجد الفيديو في مساحة التخزين.');blob=item.blob;url=URL.createObjectURL(blob);v.src=url;$('status').textContent='تم فتح الفيديو المحفوظ.';}catch(e){$('status').textContent=e.message||'تعذّر فتح الفيديو.'}}
 function draw(){if(!v.videoWidth||!v.videoHeight)return;const w=v.videoWidth,h=v.videoHeight;if(c.width!==w||c.height!==h){c.width=w;c.height=h}ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
 const z=+$('zoom').value/100,rx=+$('tiltX').value*Math.PI/180,ry=+$('tiltY').value*Math.PI/180,rz=+$('rot').value*Math.PI/180;
 const sx=Math.max(.18,Math.abs(Math.cos(ry)))*(flipX?-1:1)*z,sy=Math.max(.18,Math.abs(Math.cos(rx)))*(flipY?-1:1)*z,shearX=Math.sin(ry)*.38,shearY=-Math.sin(rx)*.38;
 ctx.save();ctx.translate(w/2,h/2);ctx.rotate(rz);ctx.transform(sx,shearY,shearX,sy,0,0);ctx.drawImage(v,-w/2,-h/2,w,h);ctx.restore();
 }
 function loop(){draw();if(!v.paused&&!v.ended)raf=requestAnimationFrame(loop)}
 v.addEventListener('loadedmetadata',()=>{draw();});v.addEventListener('play',()=>{cancelAnimationFrame(raf);loop()});v.addEventListener('pause',()=>{cancelAnimationFrame(raf);draw()});v.addEventListener('seeked',draw);
 ['zoom','rot','tiltX','tiltY'].forEach(id=>$(id).addEventListener('input',()=>{const val=$(id).value;$(id==='zoom'?'zoomVal':id==='rot'?'rotVal':id==='tiltX'?'xVal':'yVal').textContent=id==='zoom'?val+'%':val+'°';draw()}));
 $('flipX').onclick=()=>{flipX=!flipX;$('flipX').textContent=flipX?'إلغاء القلب الأفقي':'قلب أفقي';draw()};$('flipY').onclick=()=>{flipY=!flipY;$('flipY').textContent=flipY?'إلغاء القلب الرأسي':'قلب رأسي';draw()};
 $('reset').onclick=()=>{['zoom','rot','tiltX','tiltY'].forEach((id)=>{$(id).value=id==='zoom'?100:0;$(id).dispatchEvent(new Event('input'))});flipX=flipY=false;$('flipX').textContent='قلب أفقي';$('flipY').textContent='قلب رأسي';draw()};
 $('export').onclick=async()=>{if(!blob||!v.videoWidth)return;const btn=$('export');btn.disabled=true;$('status').textContent='جارٍ تجهيز الفيديو المعدّل…';try{
  const stream=c.captureStream(30);let audioStream=null;try{audioStream=v.captureStream?v.captureStream():v.mozCaptureStream?.();}catch(e){}if(audioStream)audioStream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('تسجيل الفيديو غير مدعوم في هذا المتصفح.');
  chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  recorder.onstop=()=>{const result=new Blob(chunks,{type:mime});const a=document.createElement('a');const u=URL.createObjectURL(result);a.href=u;a.download='smart-camera-edited.webm';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);$('status').textContent='تم تصدير النسخة المعدّلة. الفيديو الأصلي ما زال محفوظًا.';btn.disabled=false;stream.getTracks().forEach(t=>t.stop())};
  v.pause();v.currentTime=0;draw();recorder.start(250);await v.play();loop();v.onended=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop()};
 }catch(e){$('status').textContent=e.message||'تعذّر تصدير الفيديو.';btn.disabled=false;}}
 load();
})();
</script></body></html>
